<!DOCTYPE html>
<html>
<head>
  <title>Bramble the Bear: Star Catcher</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h1>Bramble the Bear: Star Catcher</h1>

  <div id="startScreen">
    <h2>Welcome to Bramble’s Forest</h2>
    <p>Catch stars, answer questions, and help Bramble grow.</p>

    <div id="playerSetup">
      <label for="playerName">Player Name:</label>
      <input type="text" id="playerName" maxlength="16" placeholder="Enter name">
    </div>

    <div id="scoreBoard">
      <p>Best Player: <span id="bestPlayer">None yet</span></p>
      <p>High Score: <span id="highScore">0</span></p>
    </div>

    <button id="startButton">Start Game</button>
    <button id="fullscreenButton">Fullscreen</button>
  </div>

  <div id="gameArea">

    <div id="hudLeft">
      <p>Level <span id="levelText">1</span></p>
      <p>Score <span id="score">0</span></p>
    </div>

    <div id="hudRight">
      <p id="livesText">❤️❤️❤️</p>
    </div>

    <div id="moon"></div>

    <div class="tree tree1"></div>
    <div class="tree tree2"></div>
    <div class="tree tree3"></div>

    <div id="ground"></div>

    <div id="bear">
      <img id="bearSprite" src="bramble_idle_1.png" alt="Bramble the Bear">
    </div>

    <!-- OVERLAYS NOW LIVE INSIDE THE PLAY AREA -->

    <div id="questionBox" class="hidden overlayBox">
      <h2 id="questionText">Question</h2>
      <div id="answerButtons">
        <button class="answerBtn" id="answer0"></button>
        <button class="answerBtn" id="answer1"></button>
        <button class="answerBtn" id="answer2"></button>
      </div>
    </div>

    <div id="levelBox" class="hidden overlayBox">
      <h2 id="levelTitle">Level Complete</h2>
      <p id="levelMessage"></p>
      <button id="nextLevelButton">Next Level</button>
    </div>

    <div id="gameOverBox" class="hidden overlayBox">
      <h2>Game Over</h2>
      <p id="gameOverMessage"></p>
      <button id="restartButton">Play Again</button>
    </div>

    <div id="pauseOverlay" class="hidden overlayBox smallOverlay">
      <h2>Paused</h2>
      <p>Tap Resume to keep helping Bramble.</p>
    </div>

  </div>

  <button id="pauseButton">Pause</button>

  <!-- Hidden support fields still required by your JS -->
  <div id="hiddenGameData" class="hidden">
    <span id="goalText">10</span>
    <span id="sizeText">1.0x</span>
    <span id="currentPlayer">Guest</span>
    <span id="hudHighScore">0</span>
  </div>

  <script src="game.js"></script>

</body>
</html>
